name: Project pipeline
on:
  push:
    branches: ['chore/**', 'feat/**']
    paths-ignore: ['.pipeline/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - run: scripts/pipeline-install-tools
      - run: scripts/pipeline-p1-setup pre-commit
      - run: .tooling/p1/bin/pre-commit run --all-files
      - name: Secret scan (all reachable commits, redacted)
        run: .tooling/pipeline-bin/gitleaks git --redact --no-banner --log-opts="--all"
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup show
      - run: scripts/pipeline-p1-setup core
      - run: cargo fmt --all -- --check
      - run: scripts/pipeline-with-sccache cargo clippy --locked --workspace --all-targets
      - run: scripts/pipeline-with-sccache cargo nextest run --locked --workspace --profile ci
      - name: Existing cargo test proof
        run: scripts/pipeline-with-sccache cargo test --locked --workspace
      - name: Explicit experimental multicore tests
        run: |
          cargo clippy --locked -p pb-worker-core -p phoneboost-core-jni -p pb-host --all-targets --features experimental-multicore
          cargo test --locked -p pb-worker-core --features experimental-multicore
          cargo test --locked -p phoneboost-core-jni --features experimental-multicore -- --test-threads=1
          cargo test --locked -p pb-host --features experimental-multicore
          python3 scripts/test_measure_android_multicore.py
      - name: Explicit diagnostic timing tests
        env:
          PHONEBOOST_TIMING_DIAGNOSTIC: '1'
        run: |
          cargo test --locked -p pb-types -p pb-cli -p pb-host -p pb-runtime-secure -p pb-worker-core -p phoneboost-core-jni --features pb-host/diagnostic-timing,pb-cli/diagnostic-timing,phoneboost-core-jni/diagnostic-timing -- --test-threads=2
          cargo build --locked -p pb-host -p pb-cli --features pb-host/diagnostic-timing,pb-cli/diagnostic-timing
          python3 scripts/test_c12_timing.py --daemon target/debug/phoneboostd --client target/debug/phoneboostctl
          python3 scripts/analyze_c12_timing.py docs/evidence/c12-end-to-end-timing-v0-1.json
      - name: Native C12 import client real-process proof
        run: |
          scripts/pipeline-with-sccache cargo build --locked -p pb-host --bin phoneboostd -p pb-cli --bin phoneboostctl -p pb-web-bridge --bin phoneboost-web-bridge
          python3 scripts/test_c12_import_cli.py
          python3 scripts/test_auto_use_control_cli.py
      - if: always()
        run: .tooling/p1/bin/sccache --show-stats || true
  release-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PHONEBOOST_TIMING_DIAGNOSTIC: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0 # Validate historical physical proof against its recorded source commit.
          persist-credentials: false
      - run: rustup show
      - name: Standard release functional tests
        run: cargo test --locked --release -p pb-types -p pb-cli -p pb-host -p pb-runtime-secure --features pb-host/experimental-multicore,pb-host/diagnostic-timing,pb-cli/diagnostic-timing -- --test-threads=2
      - name: Build both diagnostic profiles without custom optimization flags
        run: |
          cargo build --locked --release -p pb-host -p pb-cli --features pb-host/experimental-multicore,pb-host/diagnostic-timing,pb-cli/diagnostic-timing
          cargo build --locked -p pb-host -p pb-cli --features pb-host/experimental-multicore,pb-host/diagnostic-timing,pb-cli/diagnostic-timing
      - name: C12 profile and collection equivalence
        run: |
          python3 scripts/test_c12_timing.py --daemon target/release/phoneboostd --client target/release/phoneboostctl --reference-daemon target/debug/phoneboostd --reference-client target/debug/phoneboostctl
          PHONEBOOST_TIMING_DIAGNOSTIC=0 python3 scripts/test_c12_import_cli.py --daemon target/release/phoneboostd --client target/release/phoneboostctl
      - name: Android decrypt build guard and independent replay fixture
        run: |
          python3 scripts/check_android_crypto_build.py
          python3 scripts/test_android_crypto_build.py
          cargo build --locked --release -p pb-runtime-secure --features decrypt-bench,diagnostic-timing --example android_decrypt_bench
          target/release/examples/android_decrypt_bench --write-fixture /tmp/android-decrypt.fixture
          target/release/examples/android_decrypt_bench --measure /tmp/android-decrypt.fixture > /tmp/android-decrypt-replay.jsonl
      - name: Validate recorded physical comparison (no hardware workload)
        run: |
          python3 scripts/test_compare_c12_build_timing.py
          python3 scripts/test_analyze_session_wait.py
          python3 scripts/test_analyze_put_wait.py
          python3 scripts/test_physical_campaign_power.py
          python3 scripts/test_analyze_android_decrypt.py
          python3 scripts/analyze_android_decrypt.py docs/evidence/android-decrypt-v0-1.json
          python3 scripts/validate_put_wait_evidence.py docs/evidence/put-wait-breakdown-v0-1.json
          python3 scripts/analyze_session_wait.py docs/evidence/session-input-wait-v0-1.json
          python3 scripts/compare_c12_build_timing.py --dev docs/evidence/c12-end-to-end-timing-v0-1.json --release docs/evidence/c12-release-vs-dev-v0-1.json
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn test --watchAll=false --runInBand
        env:
          CI: 'true'
      - name: Build with existing CRA lint integration
        run: yarn build
        env:
          CI: 'true'
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - run: yarn --cwd frontend install --frozen-lockfile --non-interactive
      - run: scripts/pipeline-playwright install --with-deps chromium
      - run: scripts/pipeline-playwright test
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-artifacts
          path: |
            .tooling/p1/playwright-results
            .tooling/p1/playwright-report
          if-no-files-found: ignore
          retention-days: 7
  security-dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: scripts/pipeline-p1-setup core trivy
      - run: scripts/pipeline-security
  maestro-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: scripts/pipeline-p1-setup pre-commit
      - run: scripts/pipeline-maestro --syntax-only
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified official Android toolchain
        run: scripts/pipeline-android-setup
      - run: scripts/pipeline-p1-setup cache
      - run: rustup target add aarch64-linux-android
      - run: scripts/pipeline-android
      - name: Build isolated multicore experiment APK
        run: bash scripts/build_multicore_spike_android
      - name: Build isolated timing diagnostic APK
        run: bash scripts/build_multicore_spike_android --timing-diagnostic
