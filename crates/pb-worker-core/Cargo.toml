[package]
name = "pb-worker-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
experimental-multicore = ["dep:rustix", "rustix/thread"]

[dependencies]
blake3.workspace = true
pb-pbmux = { path = "../pb-pbmux" }
pb-runtime-secure = { path = "../pb-runtime-secure" }
pb-types = { path = "../pb-types" }

[target.'cfg(target_os = "android")'.dependencies]
rustix = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["time"], optional = true }
