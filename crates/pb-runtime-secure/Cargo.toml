[package]
name = "pb-runtime-secure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
curve25519-dalek.workspace = true
pb-pbmux = { path = "../pb-pbmux" }
pb-secure = { path = "../pb-secure" }
pb-types = { path = "../pb-types" }
rustix = { workspace = true, features = ["fs", "process", "event"] }
serde_json.workspace = true
snow.workspace = true

[features]
default = []
diagnostic-timing = ["pb-types/diagnostic-timing"]
decrypt-bench = ["rustix/time"]

[[example]]
name = "android_decrypt_bench"
required-features = ["decrypt-bench"]
