format_version = 1

[[dependency]]
name = "rustix"
version = "1.1.4"
source = "https://crates.io/crates/rustix/1.1.4"
repository = "https://github.com/bytecodealliance/rustix"
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
features = ["fs", "net", "process"]
purpose = "Linux descriptor-relative filesystem operations and local peer credentials"
justification = "Provides open/openat, statat with no-follow semantics, unlinkat, socket_peercred, OwnedFd, and AsFd without introducing nix or Tokio. Validated by the A4 Pass 1 rustix micro-gate on Rust 1.98.0."
