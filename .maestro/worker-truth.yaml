appId: org.phoneboost.app
name: Worker truth and startup
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "PhoneBoost Worker"
- assertVisible: "ON       ●"
- assertVisible: "Runtime"
- assertNotVisible: "READY"
- scrollUntilVisible:
    element:
      text: "(?s).*(Activity|Activité).*"
    direction: DOWN
- assertVisible: "(?s).*(Status|Statut).*"
- assertVisible: "(?s).*(Activity|Activité).*"
- assertVisible: "(?s).*(More|Plus).*"
