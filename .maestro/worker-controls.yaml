appId: org.phoneboost.app
name: Worker participation and advanced details
tags:
  - controls
---
- launchApp:
    clearState: true
- tapOn: "PhoneBoost participation switch"
- assertVisible: "●       OFF"
- assertNotVisible: "READY"
- tapOn: "PhoneBoost participation switch"
- assertVisible: "ON       ●"
- assertNotVisible: "READY"
- scrollUntilVisible:
    element:
      text: "Advanced details toggle"
    direction: DOWN
- tapOn: "Advanced details toggle"
- scrollUntilVisible:
    element:
      text: "(?s).*Provider ready: UNAVAILABLE.*"
    direction: DOWN
- assertVisible: "(?s).*LOCAL · ANDROID WORKER.*"
- assertVisible: "(?s).*REMOTE · CONTROLLER.*"
- assertVisible: "(?s).*Provider ready: UNAVAILABLE.*"
